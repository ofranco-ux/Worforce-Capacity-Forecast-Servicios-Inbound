<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WFM Executive Core Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0d0f1d;
            --card-bg: #16192e;
            --card-border: #262a4a;
            --accent-purple: #7a5cff;
            --accent-cyan: #00d2ff;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--card-border);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        select, button {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select:hover, button:hover {
            border-color: var(--accent-purple);
        }

        button.active {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
            color: #fff;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .metric-card.highlight {
            border-color: var(--accent-purple);
            background: linear-gradient(135deg, var(--card-bg) 0%, rgba(122, 92, 255, 0.1) 100%);
        }

        .metric-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .metric-value {
            font-size: 32px;
            font-weight: 800;
            color: var(--accent-purple);
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .metric-value span {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .chart-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            min-height: 380px;
        }

        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: left;
        }

        th {
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-muted);
            padding: 12px;
            border-bottom: 1px solid var(--card-border);
            font-weight: 600;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 15, 29, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--card-border);
            border-top-color: var(--accent-purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
    </div>

    <header>
        <h1>WFM Executive Core</h1>
        <div class="controls">
            <button class="active" onclick="switchMode('inbound')" id="btn-inbound">Inbound</button>
            <button onclick="switchMode('outbound')" id="btn-outbound">Outbound</button>
            <button onclick="switchMode('chat')" id="btn-chat">Chat</button>
            
            <select id="select-mes" onchange="applyFilters()">
                <option value="TODOS">Todos los Meses</option>
            </select>

            <select id="select-campana" onchange="applyFilters()">
                <option value="TODAS">Todas las Campañas</option>
            </select>
        </div>
    </header>

    <section class="metrics-grid">
        <div class="metric-card highlight">
            <div class="metric-title">Nómina a Contratar</div>
            <div class="metric-value" id="card-nomina">0 <span>HC</span></div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Volumen Total Proyectado</div>
            <div class="metric-value" id="card-volumen">0 <span>Llamadas</span></div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Promedio AHT</div>
            <div class="metric-value" id="card-aht">00:00:00</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">Días Forecast</div>
            <div class="metric-value" id="card-dias">0 <span>Días</span></div>
        </div>
    </section>

    <section class="dashboard-grid">
        <div class="chart-card">
            <canvas id="chartIntradia"></canvas>
        </div>
        <div class="chart-card">
            <canvas id="chartCampanas"></canvas>
        </div>
    </section>

    <section class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Campaña</th>
                    <th>Mes</th>
                    <th>Llamadas Proyectadas</th>
                    <th>AHT Promedio</th>
                    <th>Pico Max HC (Dedicado)</th>
                </tr>
            </thead>
            <tbody id="tabla-resumen">
                <!-- Se llena dinámicamente -->
            </tbody>
        </table>
    </section>

    <script>
        let rawData = [];
        let filteredData = [];
        let currentMode = 'inbound';
        let chartIntradiaInstance = null;
        let chartCampanasInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadForecastData();
        });

        async function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.controls button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
            await loadForecastData();
        }

        async function loadForecastData() {
            showLoading(true);
            try {
                const response = await fetch(`/api/latest?mode=${currentMode}`);
                if (!response.ok) throw new Error('Error al cargar datos');
                rawData = await response.json();
                
                populateSelects();
                applyFilters();
            } catch (err) {
                console.error(err);
                alert('No se pudieron obtener los datos del servidor.');
            } finally {
                showLoading(false);
            }
        }

        function populateSelects() {
            const selectMes = document.getElementById('select-mes');
            const selectCampana = document.getElementById('select-campana');

            const meses = [...new Set(rawData.map(d => d.Mes))].filter(Boolean);
            const campanas = [...new Set(rawData.map(d => d.Campaña))].filter(Boolean);

            selectMes.innerHTML = '<option value="TODOS">Todos los Meses</option>';
            meses.forEach(m => {
                selectMes.innerHTML += `<option value="${m}">${m}</option>`;
            });

            selectCampana.innerHTML = '<option value="TODAS">Todas las Campañas</option>';
            campanas.forEach(c => {
                selectCampana.innerHTML += `<option value="${c}">${c}</option>`;
            });
        }

        function applyFilters() {
            const mesSel = document.getElementById('select-mes').value;
            const campSel = document.getElementById('select-campana').value;

            filteredData = rawData.filter(d => {
                const matchMes = (mesSel === 'TODOS' || d.Mes === mesSel);
                const matchCamp = (campSel === 'TODAS' || d.Campaña === campSel);
                return matchMes && matchCamp;
            });

            renderCards(campSel);
            renderTable();
            renderCharts();
        }

        // =====================================================================
        // 🧠 CÁLCULO DEDICADO DE NÓMINA A CONTRATAR (EL CORAZÓN DEL FRONTEND)
        // =====================================================================
        function renderCards(campanaSeleccionada) {
            let totalVol = 0;
            let sumAhtSec = 0;
            let countAht = 0;

            filteredData.forEach(d => {
                totalVol += (d.Llamadas || 0);
                if (d.AHT_Segundos > 0) {
                    sumAhtSec += d.AHT_Segundos;
                    countAht++;
                }
            });

            // LÓGICA PURA DEDICADA: Suma de picos máximos por campaña
            let nominaDedicada = 0;
            
            if (filteredData.length > 0) {
                // Si la variable precalculada existe en el backend, la usa directo
                if (campanaSeleccionada === 'TODAS' && filteredData[0].Nomina_Total_Dedicada_Mes) {
                    nominaDedicada = filteredData[0].Nomina_Total_Dedicada_Mes;
                } else {
                    // Cálculo dinámico directo en JS para agrupaciones dedicadas
                    const campañasEnFiltro = [...new Set(filteredData.map(d => d.Campaña))];
                    
                    nominaDedicada = campañasEnFiltro.reduce((acumulado, camp) => {
                        const registrosCampana = filteredData.filter(d => d.Campaña === camp);
                        const maxCampana = Math.max(...registrosCampana.map(r => r.Agentes_Requeridos || 0));
                        return acumulado + maxCampana;
                    }, 0);
                }
            }

            const avgAhtSec = countAht > 0 ? Math.round(sumAhtSec / countAht) : 0;
            const diasUnicos = new Set(filteredData.map(d => d.Fecha)).size;

            document.getElementById('card-nomina').innerHTML = `${nominaDedicada} <span>HC</span>`;
            document.getElementById('card-volumen').innerHTML = `${totalVol.toLocaleString()} <span>Llamadas</span>`;
            document.getElementById('card-aht').innerText = formatSecondsToTime(avgAhtSec);
            document.getElementById('card-dias').innerHTML = `${diasUnicos} <span>Días</span>`;
        }

        function renderTable() {
            const tbody = document.getElementById('tabla-resumen');
            tbody.innerHTML = '';

            const resumenMap = {};

            filteredData.forEach(d => {
                const key = `${d.Campaña}||${d.Mes}`;
                if (!resumenMap[key]) {
                    resumenMap[key] = {
                        campana: d.Campaña,
                        mes: d.Mes,
                        llamadas: 0,
                        ahtSum: 0,
                        ahtCount: 0,
                        maxHc: 0
                    };
                }

                resumenMap[key].llamadas += (d.Llamadas || 0);
                if (d.AHT_Segundos > 0) {
                    resumenMap[key].ahtSum += d.AHT_Segundos;
                    resumenMap[key].ahtCount++;
                }
                if ((d.Agentes_Requeridos || 0) > resumenMap[key].maxHc) {
                    resumenMap[key].maxHc = d.Agentes_Requeridos;
                }
            });

            Object.values(resumenMap).forEach(r => {
                const avgAht = r.ahtCount > 0 ? Math.round(r.ahtSum / r.ahtCount) : 0;
                tbody.innerHTML += `
                    <tr>
                        <td><b>${r.campana}</b></td>
                        <td>${r.mes}</td>
                        <td>${r.llamadas.toLocaleString()}</td>
                        <td>${formatSecondsToTime(avgAht)}</td>
                        <td><b style="color: var(--accent-purple);">${r.maxHc} HC</b></td>
                    </tr>
                `;
            });
        }

        function renderCharts() {
            // Chart 1: Perfil Intradía
            const intradiaMap = {};
            filteredData.forEach(d => {
                const inter = d.Intervalo;
                intradiaMap[inter] = (intradiaMap[inter] || 0) + (d.Agentes_Requeridos || 0);
            });

            const sortedIntervals = Object.keys(intradiaMap).sort();
            const intradiaValues = sortedIntervals.map(i => intradiaMap[i]);

            if (chartIntradiaInstance) chartIntradiaInstance.destroy();
            const ctx1 = document.getElementById('chartIntradia').getContext('2d');
            chartIntradiaInstance = new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: sortedIntervals,
                    datasets: [{
                        label: 'Requerimiento HC por Intervalo',
                        data: intradiaValues,
                        borderColor: '#7a5cff',
                        backgroundColor: 'rgba(122, 92, 255, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#e2e8f0' } } },
                    scales: {
                        x: { ticks: { color: '#94a3b8' }, grid: { color: '#262a4a' } },
                        y: { ticks: { color: '#94a3b8' }, grid: { color: '#262a4a' } }
                    }
                }
            });

            // Chart 2: Picos por Campaña
            const campanaMaxMap = {};
            filteredData.forEach(d => {
                if (!campanaMaxMap[d.Campaña] || d.Agentes_Requeridos > campanaMaxMap[d.Campaña]) {
                    campanaMaxMap[d.Campaña] = d.Agentes_Requeridos;
                }
            });

            if (chartCampanasInstance) chartCampanasInstance.destroy();
            const ctx2 = document.getElementById('chartCampanas').getContext('2d');
            chartCampanasInstance = new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: Object.keys(campanaMaxMap),
                    datasets: [{
                        label: 'Pico Max HC (Dedicado)',
                        data: Object.values(campanaMaxMap),
                        backgroundColor: '#00d2ff',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#e2e8f0' } } },
                    scales: {
                        x: { ticks: { color: '#94a3b8' }, grid: { color: '#262a4a' } },
                        y: { ticks: { color: '#94a3b8' }, grid: { color: '#262a4a' } }
                    }
                }
            });
        }

        function formatSecondsToTime(seconds) {
            if (!seconds || seconds <= 0) return "00:00:00";
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function showLoading(show) {
            const overlay = document.getElementById('loading');
            if (show) overlay.classList.add('active');
            else overlay.classList.remove('active');
        }
    </script>
</body>
</html>
